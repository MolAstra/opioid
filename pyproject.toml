[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opioid"
version = "0.3.0"
description = "µORScreen: A Lightweight Consensus Modeling Framework for µ-opioid Receptor Ligand Prediction and Virtual Screening"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "chemprop>=2.2",
    "descriptastorus>=2.8,<3",
    "fastapi>=0.115,<1",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "litserve==0.2.17",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "pydantic>=2,<3",
    "rdkit",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "tabulate>=0.9",
    "tabpfn>=2.0",
    "uvicorn>=0.30,<1",
    "xgboost>=2.1",
]
authors = [{ name = "Silong Zhai" }]

[project.urls]
Homepage = "https://github.com/MolAstra/opioid"
Repository = "https://github.com/MolAstra/opioid"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opioid*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
